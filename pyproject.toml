[project]
name = "policyproof"
version = "0.1.0.dev0"
description = "Prove what an agent may decide and say, from a written policy."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "javergar", email = "jose.vergara@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["z3-solver>=4.15", "returns>=0.29", "pyyaml>=6"]

[project.optional-dependencies]
# Readers for any chat model pydantic-ai supports; add your provider's extra too, e.g. pydantic-ai-slim[bedrock].
llm = ["pydantic-ai-slim>=2.54"]
jev = ["pydantic-ai-slim[typesafe]>=2.54"]
# Reserved for later milestones.
extract = []
bedrock-ar = []

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ty", "ruff", "import-linter>=2", "jsonschema>=4", "types-pyyaml",
       "pydantic-ai-slim[bedrock,typesafe]>=2.54"]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.ty.environment]
python-version = "3.13"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["−", "×", "∨"]  # used on purpose in pretty-printed formulas

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: calls real models; needs credentials (run with -m live)"]

[tool.importlinter]
root_package = "policyproof"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core is pure: no effects, no SDKs"
type = "forbidden"
source_modules = ["policyproof.core"]
forbidden_modules = ["policyproof.effects", "policyproof.guards", "boto3", "botocore", "anthropic", "openai", "langextract",
                     "typesafe", "typesafe_sdk", "pydantic", "pydantic_ai", "httpx", "requests"]

[[tool.importlinter.contracts]]
name = "Guards are pure: the core only"
type = "forbidden"
source_modules = ["policyproof.guards"]
forbidden_modules = ["policyproof.effects", "pydantic", "pydantic_ai", "boto3", "botocore", "typesafe_sdk", "httpx"]

[[tool.importlinter.contracts]]
name = "Ports, consensus and pipelines need no provider SDK"
type = "forbidden"
source_modules = ["policyproof.effects.errors", "policyproof.effects.ports", "policyproof.effects.consensus",
                  "policyproof.effects.pipeline"]
forbidden_modules = ["policyproof.effects.llm", "policyproof.effects.jev", "pydantic", "pydantic_ai", "boto3",
                     "botocore", "typesafe_sdk", "httpx"]

[[tool.importlinter.contracts]]
name = "The LLM and Jev readers are independent"
type = "independence"
modules = ["policyproof.effects.llm", "policyproof.effects.jev"]

[[tool.importlinter.contracts]]
name = "Eval cases, grading and reports are pure: the core and guards only"
type = "forbidden"
source_modules = ["policyproof.eval.cases", "policyproof.eval.grade"]
forbidden_modules = ["policyproof.effects", "pydantic", "pydantic_ai", "boto3", "botocore", "typesafe_sdk", "httpx"]
